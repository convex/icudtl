name: CI

on:
  pull_request:
  push:
    branches: [main, "icu-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- --deny warnings
      - name: Check that the generated files are up to date
        run: cargo xtask generate --check
      - run: cargo test --locked
      - name: Check the data with icupkg
        run: |
          sudo apt-get update
          sudo apt-get install --yes icu-devtools
          scripts/check-icupkg.sh
      - name: Check the published package
        run: |
          cargo package --locked --package icudtl
          cargo package --locked --package icudtl --list
          size="$(stat --format=%s target/package/icudtl-*.crate)"
          echo "Package size: $size bytes"
          if (( size > 10 * 1000 * 1000 )); then
            echo "::error::The package is over crates.io's 10 MB limit"
            exit 1
          fi

  # Loads the data into V8 and checks `Intl` and `Temporal`. Downloads a
  # prebuilt V8, so it's slow and only runs in CI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --package e2e --all-targets -- --deny warnings
      - run: cargo test --locked --package e2e
